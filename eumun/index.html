<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>음운 당근 대작전</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3B2A1A;--gold:#D9A520;--gold2:#F4C95D;--cream:#FFF7EC;--red:#D9443A;--green:#2E9B5F;--bg:#FFF3DF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2B2118;font-family:'Jua',system-ui,sans-serif;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0) + 12px) 14px calc(env(safe-area-inset-bottom,0) + 12px);overflow:auto;touch-action:pan-y}
.scr[hidden]{display:none}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.btn{font-size:20px;padding:11px 24px;border-radius:999px;border:2.5px solid var(--ink);background:var(--gold2);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.w{background:#fff}.btn.s{font-size:15px;padding:7px 14px}
.title{font-size:36px;text-align:center;color:var(--gold);margin:2px 0 0;text-shadow:0 2px 0 #fff,0 4px 0 #E9C46A;font-weight:400}
.sub{text-align:center;font-size:14px;opacity:.75;margin:2px 0 0}
.vs{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:8px 0 4px}
.target{position:relative;display:inline-block}.target .lab{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--red);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px}
label{display:block;font-size:14px;margin:0 0 4px}
input{width:100%;font-family:inherit;font-size:18px;padding:9px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);user-select:text;-webkit-user-select:text}
.row2{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.glist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.glist button{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:9px 6px;font-size:16px;line-height:1.3;box-shadow:0 3px 0 var(--ink)}
.glist button small{display:block;font-size:11.5px;opacity:.6}
.note{font-size:12.5px;opacity:.7;text-align:center;margin-top:8px;line-height:1.5}
/* 플레이 */
#play{padding:calc(env(safe-area-inset-top,0) + 8px) 10px calc(env(safe-area-inset-bottom,0) + 10px);touch-action:none}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:16px;gap:6px}
.pill{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 11px;white-space:nowrap}
.mute{background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:13px;padding:2px 8px}
.tbar{height:9px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin-top:6px;overflow:hidden;flex:none}
.tbar i{display:block;height:100%;width:100%;background:var(--green)}
.sub2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px;min-height:22px}
.hearts{display:flex;gap:2px}.hearts svg{width:20px;height:18px}
.combo b{font-size:20px;color:var(--gold);font-weight:400}
.rule{flex:none;text-align:center;background:var(--ink);color:#FFE7A8;border-radius:14px;padding:6px 10px;font-size:20px;margin-top:6px;min-height:42px;display:flex;align-items:center;justify-content:center;gap:8px}
.rule .sym{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:900;font-size:26px;color:#fff;background:#B8401F;border-radius:10px;padding:0 10px}
.fever .rule{background:#B8401F}
.area{position:relative;flex:1;min-height:320px;margin-top:8px;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;background:#FFF7EC}
.area canvas{display:block;width:100%;height:100%;touch-action:none}
.ammo{display:flex;gap:8px;margin-top:8px;flex:none}
.ammo button{flex:1;height:70px;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:900;font-size:34px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.ammo button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ammo button.no{background:#F8C3BD}
.hint{font-size:12px;text-align:center;opacity:.6;margin-top:4px;flex:none}
/* 두더지 */
.holes{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;height:100%;padding:8px;background:linear-gradient(#BFE3A5,#9CCB7E)}
.hole{position:relative;border-radius:50% 50% 16px 16px/30% 30% 16px 16px;background:radial-gradient(ellipse at 50% 88%,#5B3A20 0 34%,transparent 35%);overflow:hidden}
.mole{position:absolute;left:50%;bottom:-90%;transform:translateX(-50%);width:70%;aspect-ratio:1/1.05;background:#fff;border:2.5px solid var(--ink);border-radius:18px 18px 8px 8px;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:900;font-size:34px;transition:bottom .14s}
.mole img{width:100%;height:100%;object-fit:contain}
.mole.pic{background:none;border:0}
.mole.up{bottom:8%}.mole.hitok{background:#BFEBCF}.mole.hitno{background:#F8C3BD}
.mole.pic.hitok,.mole.pic.hitno{background:none;filter:brightness(1.2)}
.pop{position:absolute;font-size:22px;pointer-events:none;z-index:5;white-space:nowrap}
.shake{animation:shk .3s}@keyframes shk{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.milestone{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:38px;color:#D9443A;text-shadow:0 3px 0 #fff,0 0 12px #fff;z-index:15;pointer-events:none;white-space:nowrap}
/* 오버레이 */
.ov{position:absolute;inset:0;background:rgba(43,33,24,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.ov[hidden]{display:none}
.ov .card{text-align:center;max-width:370px;width:100%;padding:18px}
.ov h2{margin:0;font-size:28px;color:var(--gold);font-weight:400}
.ov p{margin:6px 0;font-size:16px;line-height:1.55}
.host{display:flex;align-items:center;gap:10px;text-align:left;margin:10px 0}.host img{height:74px;flex:none}
.host .say{background:#FFF7EC;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:15px;line-height:1.5}
.cnt{font-size:54px;color:var(--red)}
.hop{animation:hop .35s infinite alternate}@keyframes hop{to{transform:translateY(-10px)}}
/* 결과 */
.score{font-size:52px;text-align:center;color:var(--gold);margin:0}
.grade{text-align:center;font-size:20px}
.gs{font-size:14px;line-height:1.8;display:grid;grid-template-columns:1fr auto;column-gap:10px}
.gs b{text-align:right;font-weight:400}
.rev{font-size:14px;line-height:1.55;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:500}.rev .it{border-top:1.5px dashed #D8C3A0;padding:7px 2px}.rev .it:first-child{border-top:0}
.rev .a{color:var(--green);font-weight:700}
.walk{height:110px;animation:walk 3s ease-in .6s forwards}
@keyframes walk{0%{transform:translateX(0)}70%{transform:translateX(110px);opacity:1}100%{transform:translateX(130px);opacity:.35}}
.conf{position:absolute;top:-20px;width:9px;height:14px;z-index:30;pointer-events:none}
/* 순위표 */
.btabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:6px 0 0;scrollbar-width:none}
.btabs::-webkit-scrollbar{display:none}
.btabs button{flex:none;font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.btabs button.on{background:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:16px}
td{padding:7px 4px;border-bottom:1.5px dashed #E5D2B2}
td.r{width:36px;text-align:center;color:var(--gold);font-size:19px}td.s{text-align:right}
td small{font-size:12px;opacity:.6;display:block}
tr.me td{background:#FFF0B8}
</style>
</head>

window.CLOUD=(function(){
  const cfg={apiKey:"AIzaSyATP1jt4mQRhaC_5THouQ4iI4xM7Ff6Kck",authDomain:"hayomi-games.firebaseapp.com",projectId:"hayomi-games",storageBucket:"hayomi-games.firebasestorage.app",messagingSenderId:"388207975324",appId:"1:388207975324:web:56acc4e7c5c85667ab8659"};
  const V='https://www.gstatic.com/firebasejs/10.12.2/';let p=null;
  const ready=()=>p||(p=Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js')]).then(([a,f])=>({f,db:f.getFirestore(a.initializeApp(cfg))})));
  const to=(pr,ms=8000)=>Promise.race([pr,new Promise((_,j)=>setTimeout(()=>j('timeout'),ms))]);
  return{
    async play(game){try{const {f,db}=await to(ready());await to(f.setDoc(f.doc(db,'stats',game),{plays:f.increment(1)},{merge:true}));return true}catch(e){return false}},
    async plays(game){try{const {f,db}=await to(ready());const s=await to(f.getDoc(f.doc(db,'stats',game)));return s.exists()?s.data().plays:0}catch(e){return null}},
    async save(board,name,score,id){try{const {f,db}=await to(ready());const data={name:String(name).slice(0,8),score:Math.max(0,Math.min(300000,Math.round(score))),at:f.serverTimestamp()};
      if(id)await to(f.setDoc(f.doc(db,'boards',board,'rows',id),data));else await to(f.addDoc(f.collection(db,'boards',board,'rows'),data));return true}catch(e){return e&&e.code==='permission-denied'&&id?true:false}},
    async top(board){try{const {f,db}=await to(ready());const s=await to(f.getDocs(f.query(f.collection(db,'boards',board,'rows'),f.orderBy('score','desc'),f.limit(400))));
      const m=new Map();s.forEach(d=>{const x=d.data();const r=m.get(x.name);if(!r)m.set(x.name,{name:x.name,best:x.score,n:1});else{r.n++;if(x.score>r.best)r.best=x.score}});
      return[...m.values()].sort((a,b)=>b.best-a.best)}catch(e){return null}}
  };
})();

let AC=null,muted=false;try{muted=localStorage.getItem('phon-mute')==='1'}catch(_){}
function ac(){if(muted)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(_){AC=null}return AC}
function tone(f,d=.08,type='square',v=.06,when=0,slide=0){const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SFX={ok(c){const f=520*Math.pow(1.06,Math.min(c,14));tone(f,.07,'square',.05);tone(f*1.5,.09,'square',.04,.06)},
  no(){tone(180,.18,'sawtooth',.05,0,90)},hit(){tone(140,.09,'triangle',.12,0,60)},beep(){tone(660,.08,'sine',.08)},go(){tone(990,.18,'sine',.09)},
  shoot(){tone(400,.1,'square',.04,0,900)},gold(){[0,1,2,3].forEach(i=>tone(700+i*180,.09,'square',.05,i*.06))},fan(){[523,659,784,1046].forEach((f,i)=>tone(f,.16,'square',.05,i*.12))},
  mile(){[880,1175].forEach((f,i)=>tone(f,.1,'square',.05,i*.08))},jump(){tone(500,.08,'sine',.06,0,800)},boom(){tone(90,.35,'sawtooth',.08,0,40)}};

  d.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0},{transform:'translate(-50%,-50%) scale(1.15)',opacity:1,offset:.3},{transform:'translate(-50%,-60%) scale(1)',opacity:0}],{duration:1000}).onfinish=()=>d.remove()}
const API={
  ok(base=100){R.combo++;R.right++;const fev=R.combo>=8;const p=Math.round(base*(1+Math.min(R.combo,10)*.1)*(fev?2:1));R.score+=p;R.gScore+=p;SFX.ok(R.combo);
    if(R.combo===8)milestone('피버 타임 점수 2배');else if(R.combo>8&&R.combo%5===0)milestone(R.combo+'연속');else if(R.combo===5)milestone('5연속');hud();return p},
  no(item,ans,exp,pen=50){if(R.combo>=8)milestone('피버 끝');R.combo=0;R.wrongN++;R.score=Math.max(0,R.score-pen);R.gScore-=pen;SFX.no();
    if(item&&!R.wrong.some(w=>w.q===item))R.wrong.push({q:item,a:ans,exp});hud();return pen},
  plain(p){R.score=Math.max(0,R.score+p);R.gScore+=p;hud()},

};

GAMES.run={name:'당근 러너',desc:'위에 뜬 글자를 보고, 맞는 문이 있는 길을 터치해서 갈아타요. 당근은 먹고 바나나 껍질은 피해요.',line:'틀린 문에 부딪히면 은지T가 따라와요',dur:50,hearts:true,
 start(area,ctx){
  const o=mkCanvas(area);fx(o);const x=o.x;
  let split=pick(SPLITS),gateN=0,lane=0,by=0,items=[],gates=[],dist=0,chase=0,spawnD=60,nextGate=null,trip=0;
  const cur=()=>(gates.find(g=>!g.done)||{split}).split,nL=()=>cur().cats.length,top=()=>70,LH=()=>(o.H-top()-10)/nL(),laneY=i=>top()+LH()*(i+.5);
  const bx=()=>o.W*0.3;
  function newGate(){if(gateN>0&&gateN%4===0){let s;do{s=pick(SPLITS)}while(s===split);split=s;milestone('곧 문이 바뀌어요')}
    gateN++;const sym=pick(split.pool);return{x:o.W+40,sym,split,cats:split.cats.slice()}}
  nextGate=newGate();gates.push(nextGate);by=laneY(0);
  const setRule=()=>{const g=gates.find(g=>!g.done);if(g)API.rule(`<span class="sym">${g.sym}</span> 맞는 문으로 가요`)};setRule();
  canvasPointer(o,(px,py,t)=>{if(t!=='pointerdown')return;const i=Math.max(0,Math.min(nL()-1,Math.floor((py-top())/LH())));if(i!==lane){lane=i;SFX.jump()}});
  ctx.key(k=>{if(k==='ArrowUp'&&lane>0){lane--;SFX.jump()}if(k==='ArrowDown'&&lane<nL()-1){lane++;SFX.jump()}});
  ctx.frame(dt=>{

function popTxt(X,Y,t,c){const d=document.createElement('div');d.className='pop';d.textContent=t;d.style.color=c;d.style.left=X+'px';d.style.top=Y+'px';$('area').appendChild(d);

/* ================= 진행 ================= */
let loopId=0,timers=[],keyH=null;
function clearAll(){cancelAnimationFrame(loopId);timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[];keyH=null;$('extra').innerHTML='';$('area').style.flex=''}
addEventListener('keydown',e=>{if(keyH&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();keyH(e.key)}});
function startRun(list){CLOUD.play('eumun').then(ok=>ok&&showPlays());R={runId:Date.now().toString(36)+Math.random().toString(36).slice(2,7),done:false,list,idx:0,hits:0,score:0,combo:0,right:0,wrongN:0,wrong:[],per:[],name:$('nm').value.trim(),practice:list.length===1};show('play');runGame()}
function runGame(){
  clearAll();const key=R.list[R.idx],g=GAMES[key];R.gScore=0;R.inGame=true;R.hearts=g.hearts?3:null;R.endNow=false;hud();
  $('rdLab').textContent=R.practice?'연습':`${R.idx+1}/${R.list.length}`;$('gName').textContent=g.name;$('area').innerHTML='';$('rule').textContent='';$('tBar').style.width='100%';
  let n=3;overlay(`<h2>${g.name}</h2><div class="host"><img src="${IMG.b.src}" alt=""><div class="say">${g.desc}<br><span style="font-size:13px;opacity:.75">${g.line}</span></div></div><div class="cnt" id="cnt">3</div>`);
  SFX.beep();const ci=setInterval(()=>{n--;if(n>0){$('cnt').textContent=n;SFX.beep()}else{clearInterval(ci);hideOv();SFX.go();go()}},700);timers.push(ci);
  function go(){
    const t0=performance.now();let last=t0;const frames=[];
    const ctx={t:()=>(performance.now()-t0)/1000,frame:f=>frames.push(f),key:f=>{keyH=f},
      every:(f,gap,skipFirst)=>{const tick=()=>{f();timers.push(setTimeout(tick,gap()))};if(skipFirst)timers.push(setTimeout(tick,gap()));else tick()}};
    g.start($('area'),ctx);
    const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;frames.forEach(f=>f(dt));
      const left=g.dur-(now-t0)/1000,r=Math.max(0,left/g.dur),b=$('tBar');b.style.width=r*100+'%';b.style.background=r<.25?'#D9443A':r<.5?'#E9A23B':'#2E9B5F';
      if(left<=0||R.endNow){endGame(R.endNow);return}loopId=requestAnimationFrame(loop)};
    loopId=requestAnimationFrame(loop);
  }
}
function endGame(out){
  if(R.done)return;clearAll();R.inGame=false;const name=GAMES[R.list[R.idx]].name;R.per.push([name,R.gScore]);saveRec(R.list[R.idx],Math.max(0,R.gScore));R.idx++;
  if(R.idx<R.list.length){overlay(`<h2>${out?'하트 다 씀':name+' 끝'}</h2><p style="font-size:30px;color:#D9A520;margin:4px 0">+${Math.max(0,R.gScore)}</p><img class="hop" src="${BUNNY_BACK}" alt="" style="height:80px"><p>다음 게임으로 이동 중</p>`);timers.push(setTimeout(runGame,1300))}
  else finish();
}
function grade(s){return s>=9000?['S','음운 고수 인정']:s>=6500?['A','거의 다 왔어요']:s>=4000?['B','기본은 잡혔어요']:s>=2000?['C','표를 한 번 더 보고 와요']:['D','음운 체계 표부터 다시']}
function finish(){
  R.done=true;hideOv();show('result');const [g,cm]=grade(R.score);
  $('rsTitle').textContent=R.practice?'연습 끝':'대작전 끝';$('rsScore').textContent=R.score.toLocaleString()+'점';
  $('rsGrade').textContent=R.practice?`정답 ${R.right}개 · 오답 ${R.wrongN}개`:`${g}등급 · ${cm}`;
  $('rsGames').innerHTML=`<span>은지T 맞힌 횟수</span><b>${R.hits}</b>`+R.per.map(p=>`<span>${p[0]}</span><b>${Math.max(0,p[1]).toLocaleString()}</b>`).join('')+`<span>정답 / 오답</span><b>${R.right} / ${R.wrongN}</b>`;
  $('runLab').textContent=`당근 ${R.hits}번 맞은 은지T 도망가는 중`;const w=$('walkImg');w.style.animation='none';void w.offsetWidth;w.style.animation='';
  $('rev').innerHTML=R.wrong.length?R.wrong.slice(-12).map(x=>`<div class="it">${x.q} → <span class="a">${x.a}</span><br><span style="opacity:.75">${x.exp}</span></div>`).join(''):'<div class="it">틀린 것 없음</div>';
  if(!R.practice)saveRec('total',R.score);SFX.fan();if(R.practice||R.score>=4000)setTimeout(confetti,300);
}
function confetti(){const cols=['#F4C95D','#F7B6C8','#2E9B5F','#D9443A','#7FB3E8'];for(let i=0;i<60;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'%';d.style.background=pick(cols);
  $('result').appendChild(d);d.animate([{transform:'translateY(0) rotate(0)'},{transform:`translateY(${innerHeight+40}px) rotate(${Math.random()*900}deg) translateX(${(Math.random()-.5)*120}px)`}],{duration:1600+Math.random()*1600,delay:Math.random()*500,easing:'ease-in'}).onfinish=()=>d.remove()}}

/* ================= 순위표 (이 기기에 저장) ================= */
const LS='phon-carrot-board';
const clean=s=>String(s||'').replace(/[<>&"\n\r]/g,'').trim().slice(0,8);
const getB=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(_){return[]}};
const putB=a=>{try{localStorage.setItem(LS,JSON.stringify(a.slice(0,600)))}catch(_){}};
let lastKey=null;
const PQ='phon-pending';
const getQ=()=>{try{return JSON.parse(localStorage.getItem(PQ)||'[]')}catch(_){return[]}};
const putQ=a=>{try{localStorage.setItem(PQ,JSON.stringify(a))}catch(_){}};
function cloudSave(board,name,score,id){const q=getQ();if(!q.some(x=>x.id===id))q.push({board,name,score,id});putQ(q);
  CLOUD.save(board,name,score,id).then(ok=>{if(ok)putQ(getQ().filter(x=>x.id!==id))})}
function flushQ(){for(const x of getQ())CLOUD.save(x.board,x.name,x.score,x.id).then(ok=>{if(ok)putQ(getQ().filter(y=>y.id!==x.id))})}
function partialRecs(){if(!R||R.done)return[];const out=[];const name=clean(R.name);
  if(R.inGame&&R.idx<R.list.length)out.push({g:R.list[R.idx],score:Math.max(0,R.gScore||0)});
  if(!R.practice)out.push({g:'total',score:R.score});return out.map(o=>({...o,name,board:'eumun_'+o.g,id:R.runId+'_'+o.g}))}
function savePartial(){const recs=partialRecs();if(!recs.length)return;R.done=true;clearAll();for(const r of recs)saveRec(r.g,r.score)}
document.addEventListener('visibilitychange',()=>{if($('play').hidden||!R||R.done)return;
  if(document.visibilityState==='hidden'){const q=getQ().filter(x=>!x.tmp);for(const r of partialRecs())q.push({board:r.board,name:r.name,score:r.score,id:r.id,tmp:1});putQ(q)}
  else putQ(getQ().filter(x=>!x.tmp))});
addEventListener('pagehide',()=>{if(!$('play').hidden&&R&&!R.done){const recs=partialRecs();for(const r of recs)CLOUD.save(r.board,r.name,r.score,r.id)}});
function saveRec(g,score){const a=getB(),name=clean(R.name);let r=a.find(x=>x.name===name);if(!r){r={name,best:{},n:{}};a.push(r)}
  r.n[g]=(r.n[g]||0)+1;if(!(g in r.best)||score>r.best[g])r.best[g]=score;lastKey=name;putB(a);cloudSave('eumun_'+g,name,score,(R.runId||Date.now().toString(36))+'_'+g)}
let tab='total';
const BTABS=[['total','종합']].concat(Object.entries(GAMES).map(([k,g])=>[k,g.name]));
$('btabs').innerHTML=BTABS.map(([k,n])=>`<button data-t="${k}" class="${k==='total'?'on':''}">${n}</button>`).join('');
$('btabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;[...$('btabs').children].forEach(x=>x.classList.toggle('on',x===b));renderBoard()});
let boardSeq=0;
async function renderBoard(){const my=++boardSeq;$('tbl').innerHTML='<tr><td style="text-align:center;padding:18px">순위표 불러오는 중</td></tr>';
  let a=await CLOUD.top('eumun_'+tab);if(my!==boardSeq)return;
  if(a){$('boardNote').innerHTML='모든 학생의 기록이 모여요. 이름마다 최고 점수로 순위가 매겨져요.<br>게임별 순위에는 도전과 연습 기록이 다 들어가요.';a=a.slice(0,50).map(r=>({name:r.name,best:{[tab]:r.best},n:{[tab]:r.n}}))}
  else{$('boardNote').textContent='인터넷 연결이 안 돼서 이 기기 기록만 보여요.';a=getB().filter(r=>tab in r.best);a.sort((x,y)=>y.best[tab]-x.best[tab]);a=a.slice(0,50)}
  $('tbl').innerHTML=a.length?a.map((r,i)=>`<tr class="${r.name===lastKey?'me':''}"><td class="r">${i+1}</td><td>${r.name||'이름 없음'}<small>${r.n[tab]}번 도전</small></td><td class="s">${r.best[tab].toLocaleString()}</td></tr>`).join('')
   :`<tr><td style="text-align:center;padding:18px">아직 기록이 없어요.</td></tr>`}
let clrArm=false;
$('clrBtn').onclick=()=>{if(!clrArm){clrArm=true;$('clrBtn').textContent='한 번 더 누르면 삭제';setTimeout(()=>{clrArm=false;$('clrBtn').textContent='기록 전부 지우기'},2500);return}
  putB([]);clrArm=false;$('clrBtn').textContent='기록 전부 지우기';renderBoard()};

/* ================= 화면 ================= */
const show=id=>['home','play','result','board'].forEach(s=>$(s).hidden=s!==id);
function overlay(h){$('ovCard').innerHTML=h;$('ov').hidden=false}
function hideOv(){$('ov').hidden=true}
$('glist').innerHTML=Object.entries(GAMES).map(([k,g])=>`<button data-k="${k}">${g.name}<small>${g.dur}초</small></button>`).join('');
function needName(){const n=$('nm').value.trim();if(!n){$('nm').focus();$('nm').placeholder='이름을 먼저 입력해요';$('nm').style.borderColor='#D9443A';return true}try{localStorage.setItem('phon-nm',n)}catch(_){}return false}
$('goBtn').onclick=()=>{if(needName())return;startRun(shuffle(Object.keys(GAMES)))};
$('glist').onclick=e=>{const b=e.target.closest('button');if(!b||needName())return;startRun([b.dataset.k])};
$('againBtn').onclick=()=>startRun(R.practice?R.list:shuffle(Object.keys(GAMES)));
const toBoard=()=>{show('board');renderBoard()};$('rankBtn').onclick=toBoard;$('rank2Btn').onclick=toBoard;
$('homeBtn').onclick=()=>show('home');$('home2Btn').onclick=()=>{$('nm').value='';show('home')};
try{$('nm').value=localStorage.getItem('phon-nm')||''}catch(_){}
$('quitBtn').onclick=()=>{if(!R||R.done)return;savePartial();hideOv();show('home');showPlays()};
flushQ();
async function showPlays(){const n=await CLOUD.plays('eumun');$('playCount').textContent=n!=null?`지금까지 총 ${n.toLocaleString()}번 플레이`:'플레이 횟수를 불러오지 못했어요'}
showPlays();
</script>
</body>
</html>
