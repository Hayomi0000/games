<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>맞춤법 대작전</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3B2A1A;--gold:#D9A520;--gold2:#F4C95D;--cream:#FFF7EC;--red:#D9443A;--green:#2E9B5F;--bg:#FFF3DF;--nk:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2B2118;font-family:'Jua',system-ui,sans-serif;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0) + 12px) 14px calc(env(safe-area-inset-bottom,0) + 12px);overflow:auto;touch-action:pan-y}
.scr[hidden]{display:none}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.btn{font-size:20px;padding:11px 22px;border-radius:999px;border:2.5px solid var(--ink);background:var(--gold2);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.w{background:#fff}.btn.s{font-size:15px;padding:7px 14px}
.title{font-size:36px;text-align:center;color:var(--gold);margin:2px 0 0;text-shadow:0 2px 0 #fff,0 4px 0 #E9C46A;font-weight:400}
.sub{text-align:center;font-size:14px;opacity:.75;margin:2px 0 0}
.note{font-size:12.5px;opacity:.7;text-align:center;margin-top:8px;line-height:1.5}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px}
.lab2{font-size:15px;text-align:center;margin-top:12px}
.who{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.who button{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:8px 2px 6px;box-shadow:0 3px 0 var(--ink);font-size:18px}
.who button img{width:100%;max-width:62px;display:block;margin:0 auto 2px}
.who button.on{background:var(--gold2);transform:translateY(-3px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.chips button{font-size:14px;padding:6px 11px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.chips button.on{background:var(--gold2)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.games button{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 6px;font-size:17px;line-height:1.3;box-shadow:0 3px 0 var(--ink)}
.games button small{display:block;font-size:12px;opacity:.6}
.row2{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* 플레이 */
#play{padding:calc(env(safe-area-inset-top,0) + 8px) 10px calc(env(safe-area-inset-bottom,0) + 10px);touch-action:none}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:16px;gap:6px}
.pill{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 11px;white-space:nowrap}
.mute{background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:13px;padding:2px 8px}
.tbar{height:9px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin-top:6px;overflow:hidden;flex:none}
.tbar i{display:block;height:100%;width:100%;background:var(--green)}
.sub2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px;min-height:22px}
.hearts{display:flex;gap:2px}.hearts svg{width:20px;height:18px}
.combo b{font-size:20px;color:var(--gold);font-weight:400}
.rule{flex:none;text-align:center;background:var(--ink);color:#FFE7A8;border-radius:14px;padding:6px 10px;font-size:18px;margin-top:6px;min-height:40px;display:flex;align-items:center;justify-content:center}
.fever .rule{background:#B8401F}
.area{position:relative;flex:1;min-height:260px;margin-top:8px;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;background:#FFF7EC}
.area canvas{display:block;width:100%;height:100%;touch-action:none}
.area.short{flex:none;height:min(210px,28vh);min-height:0}
.qcard{flex:none;margin-top:8px;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px;text-align:center;font-family:var(--nk);font-weight:700;font-size:18px;line-height:1.5;min-height:96px;display:flex;flex-direction:column;justify-content:center}
.qcard .tag{font-family:'Jua';font-weight:400;font-size:13px;color:var(--gold)}
.qcard .small{font-size:15.5px}
.qcard .blank{display:inline-block;min-width:54px;border-bottom:3px solid var(--red);color:var(--red)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;flex:none}
.opts.one{grid-template-columns:1fr}
.opts button{min-height:64px;font-family:var(--nk);font-weight:900;font-size:20px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:6px;word-break:keep-all;line-height:1.25}
.opts.small button{font-size:15.5px;font-weight:700}
.opts.one button{min-height:52px;font-size:17px;font-weight:700}
.opts button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opts button.ok{background:#BFEBCF}.opts button.no{background:#F8C3BD}
.toast{position:absolute;left:12px;right:12px;top:140px;background:#FFF0D2;border:2px solid var(--gold);border-radius:14px;padding:8px 12px;font-family:var(--nk);font-size:14px;line-height:1.5;z-index:8;pointer-events:none;transition:opacity .2s}
.toast b{color:var(--red)}
.shake{animation:shk .3s}@keyframes shk{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.milestone{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:34px;color:#D9443A;text-shadow:0 3px 0 #fff,0 0 12px #fff;z-index:15;pointer-events:none;white-space:nowrap}
.ov{position:absolute;inset:0;background:rgba(43,33,24,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.ov[hidden]{display:none}
.ov .card{text-align:center;max-width:370px;width:100%;padding:18px}
.ov h2{margin:0;font-size:28px;color:var(--gold);font-weight:400}
.ov p{margin:6px 0;font-size:16px;line-height:1.55}
.host{display:flex;align-items:center;gap:10px;text-align:left;margin:10px 0}.host img{height:70px;flex:none}
.host .say{background:#FFF7EC;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:15px;line-height:1.5}
.cnt{font-size:54px;color:var(--red)}
.score{font-size:50px;text-align:center;color:var(--gold);margin:0}
.grade{text-align:center;font-size:19px}
.gs{font-size:14px;line-height:1.8;display:grid;grid-template-columns:1fr auto;column-gap:10px}.gs b{text-align:right;font-weight:400}
.rev{font-size:14px;line-height:1.6;font-family:var(--nk);font-weight:500}.rev .it{border-top:1.5px dashed #D8C3A0;padding:7px 2px}.rev .it:first-child{border-top:0}
.rev .a{color:var(--green);font-weight:700}.law{display:inline-block;background:#F4E2B8;border-radius:6px;padding:0 6px;font-size:12px;margin-right:4px;font-family:var(--nk);font-weight:700}
.conf{position:absolute;top:-20px;width:9px;height:14px;z-index:30;pointer-events:none}
/* 도감 */
.dexbar{display:flex;align-items:center;justify-content:space-between;font-size:15px;margin-top:6px}
.chap{font-size:17px;margin:14px 2px 6px;color:#7A4E12}
.art{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:9px 11px;margin-bottom:8px}
.art .h{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.art .h b{font-weight:400;color:var(--red);margin-right:6px}
.art .stars{color:#D9A520;font-size:15px;letter-spacing:1px}.art .stars i{color:#DDD;font-style:normal}
.art .k{font-family:var(--nk);font-size:13.5px;line-height:1.6;margin-top:4px}
.art .ex{font-family:var(--nk);font-size:13px;color:#2E6B4A;margin-top:3px;font-weight:700}
.art .go{float:right;font-size:13px;padding:3px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--gold2);margin-top:4px}
.art.m3{background:#FFF8DD}
/* 순위표 */
.btabs{display:flex;gap:6px;justify-content:center;padding:4px 2px 8px;margin:6px 0 0}
.btabs button{font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.btabs button.on{background:var(--gold2)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 10px}
.podium .p{text-align:center;width:30%}.podium .p img{width:56px;display:block;margin:0 auto}
.podium .blk{border:2.5px solid var(--ink);border-radius:12px 12px 0 0;background:var(--gold2);font-size:22px;padding-top:4px}
.podium .nm{font-size:16px}.podium .sc{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:16px}
td{padding:6px 4px;border-bottom:1.5px dashed #E5D2B2;vertical-align:middle}
td.r{width:30px;text-align:center;color:var(--gold);font-size:19px}td.s{text-align:right}
td img{width:32px;vertical-align:middle;margin-right:6px}
td small{font-size:12px;opacity:.6}
tr.me td{background:#FFF0B8}
</style>
</head>
<body>
<div id="app">

<section class="scr" id="home">
  <h1 class="title">맞춤법 대작전</h1>
  <p class="sub">명덕여고 1학년 · 공통국어2 한글 맞춤법 제1~57항</p>
  <p class="sub" id="playCount" style="color:#B8401F;opacity:1"></p>
  <div class="lab2">누가 할 차례?</div>
  <div class="who" id="who"></div>
  <div class="lab2">범위</div>
  <div class="chips" id="range"></div>
  <div class="row2"><button class="btn" id="goBtn">두 판 연속 도전</button></div>
  <div class="games" id="glist"></div>
  <div class="row2"><button class="btn w" id="dexBtn">규정 도감</button><button class="btn w" id="rankBtn">순위표</button></div>
  <p class="note">맞힌 문제의 조항은 도감에 별이 쌓여요. 조항마다 별 3개를 모아 보세요.</p>
</section>

<section class="scr" id="play" hidden>
  <div class="hd"><span class="pill" id="rdLab">1/2</span><span id="gName" style="font-size:18px">게임</span><span class="pill" id="scLab">0</span><button class="mute" id="muteBtn">소리 켬</button></div>
  <div class="tbar"><i id="tBar"></i></div>
  <div class="sub2"><span class="hearts" id="hearts"></span><span class="combo">콤보 <b id="cbLab">0</b></span><span id="meLab"></span></div>
  <div class="rule" id="rule"></div>
  <div class="area" id="area"></div>
  <div id="extra" style="display:contents"></div>
</section>

/* 전체 순위표·플레이 횟수 (Firebase) */
window.CLOUD=(function(){
  const cfg={apiKey:"AIzaSyATP1jt4mQRhaC_5THouQ4iI4xM7Ff6Kck",authDomain:"hayomi-games.firebaseapp.com",projectId:"hayomi-games",storageBucket:"hayomi-games.firebasestorage.app",messagingSenderId:"388207975324",appId:"1:388207975324:web:56acc4e7c5c85667ab8659"};
  const V='https://www.gstatic.com/firebasejs/10.12.2/';let p=null;
  const ready=()=>p||(p=Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js')]).then(([a,f])=>({f,db:f.getFirestore(a.initializeApp(cfg))})));
  const to=(pr,ms=8000)=>Promise.race([pr,new Promise((_,j)=>setTimeout(()=>j('timeout'),ms))]);
  return{
    async play(game){try{const {f,db}=await to(ready());await to(f.setDoc(f.doc(db,'stats',game),{plays:f.increment(1)},{merge:true}));return true}catch(e){return false}},
    async plays(game){try{const {f,db}=await to(ready());const s=await to(f.getDoc(f.doc(db,'stats',game)));return s.exists()?s.data().plays:0}catch(e){return null}},
    async save(board,name,score){try{const {f,db}=await to(ready());await to(f.addDoc(f.collection(db,'boards',board,'rows'),{name:String(name).slice(0,8),score:Math.max(0,Math.min(300000,Math.round(score))),at:f.serverTimestamp()}));return true}catch(e){return false}},
    async top(board){try{const {f,db}=await to(ready());const s=await to(f.getDocs(f.query(f.collection(db,'boards',board,'rows'),f.orderBy('score','desc'),f.limit(400))));
      const m=new Map();s.forEach(d=>{const x=d.data();const r=m.get(x.name);if(!r)m.set(x.name,{name:x.name,best:x.score,n:1});else{r.n++;if(x.score>r.best)r.best=x.score}});
      return[...m.values()].sort((a,b)=>b.best-a.best)}catch(e){return null}}
  };
})();

const ARTS=[
 [1,1,'총칙: 표기 원칙','한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.'],
 [2,1,'총칙: 띄어쓰기 원칙','문장의 각 단어는 띄어 씀을 원칙으로 한다.'],
 [3,1,'총칙: 외래어','외래어는 외래어 표기법에 따라 적는다.'],
 [4,2,'자모','자모는 24자. 이름은 기역, 니은, 디귿, 리을, 미음, 비읍, 시옷, 이응, 지읒, 치읓, 키읔, 티읕, 피읖, 히읗. 사전 순서는 자음 ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ, 모음 ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ.'],
 [5,3,'된소리','한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 된소리로 적는다(두 모음 사이, ㄴ·ㄹ·ㅁ·ㅇ 받침 뒤). 다만 ㄱ, ㅂ 받침 뒤의 된소리는 같은 음절이나 비슷한 음절이 겹쳐 나는 경우가 아니면 된소리로 적지 않는다.'],
 [6,3,'구개음화','ㄷ, ㅌ 받침 뒤에 종속적 관계를 가진 -이(-)나 -히-가 올 적에는 ㅈ, ㅊ으로 소리 나더라도 ㄷ, ㅌ으로 적는다.'],
 [7,3,'ㄷ 소리 받침','ㄷ 소리로 나는 받침 중에서 ㄷ으로 적을 근거가 없는 것은 ㅅ으로 적는다.'],
 [8,3,'모음 ㅖ','계, 례, 몌, 폐, 혜의 ㅖ는 ㅔ로 소리 나는 경우가 있더라도 ㅖ로 적는다. 다만 게송, 게시판, 휴게실은 ㅔ로 적는다.'],
 [9,3,'모음 ㅢ','의나 자음을 첫소리로 가진 음절의 ㅢ는 ㅣ로 소리 나는 경우가 있더라도 ㅢ로 적는다.'],
 [10,3,'두음 법칙: 녀·뇨·뉴·니','녀, 뇨, 뉴, 니가 단어 첫머리에 오면 여, 요, 유, 이로 적는다. 첫머리가 아니면 본음대로(남녀). 접두사처럼 쓰이는 한자나 합성어 뒷말은 두음 법칙대로(신여성, 남존여비).'],
 [11,3,'두음 법칙: 랴·려·례·료·류·리','단어 첫머리의 랴, 려, 례, 료, 류, 리는 야, 여, 예, 요, 유, 이로 적는다. 첫머리가 아니면 본음대로(혼례). 다만 모음이나 ㄴ 받침 뒤의 렬, 률은 열, 율로 적는다(비율, 백분율).'],
 [12,3,'두음 법칙: 라·래·로·뢰·루·르','단어 첫머리의 라, 래, 로, 뢰, 루, 르는 나, 내, 노, 뇌, 누, 느로 적는다. 첫머리가 아니면 본음대로(극락, 왕래). 접두사처럼 쓰이는 한자 뒤는 두음 법칙대로(상노인).'],
 [13,3,'겹쳐 나는 소리','한 단어 안에서 같은 음절이나 비슷한 음절이 겹쳐 나는 부분은 같은 글자로 적는다.'],
 [14,4,'체언과 조사','체언은 조사와 구별하여 적는다.'],
 [15,4,'어간과 어미','용언의 어간과 어미는 구별하여 적는다. 앞말의 본뜻이 유지되면 원형을 밝히고(넘어지다), 본뜻에서 멀어지면 밝히지 않는다(드러나다). 종결형 어미 -오는 요로 소리 나도 오로 적는다.'],
 [16,4,'-아/-어','어간의 끝음절 모음이 ㅏ, ㅗ이면 -아로, 그 밖의 모음이면 -어로 적는다.'],
 [17,4,'조사 요','어미 뒤에 덧붙는 조사 요는 요로 적는다(읽어요, 참으리요).'],
 [18,4,'불규칙 활용','어간의 끝이나 어미가 바뀔 경우 바뀐 대로 적는다(그어, 퍼, 걸어, 가까워, 도와, 하여, 푸르러, 갈라).'],
 [19,4,'어간 + -이, -음','어간에 -이나 -음/-ㅁ이 붙어 명사가 되거나 -이, -히가 붙어 부사가 된 것은 원형을 밝힌다(만듦, 미닫이). -이, -음 외의 모음 접미사가 붙으면 밝히지 않는다(마개, 무덤).'],
 [20,4,'명사 + -이','명사 뒤에 -이가 붙어서 된 말은 원형을 밝힌다(샅샅이). -이 외의 모음 접미사가 붙으면 밝히지 않는다(지붕, 이파리).'],
 [21,4,'자음 접미사','명사나 어간 뒤에 자음으로 시작된 접미사가 붙은 말은 원형을 밝힌다(넓적하다, 굵다랗다). 겹받침의 끝소리가 드러나지 않으면 소리대로 적는다(널따랗다, 짤막하다).'],
 [22,4,'사동·피동 접미사','-기-, -리-, -이-, -히-, -구-, -우-, -추-, -으키-, -이키-, -애-가 붙은 말은 원형을 밝힌다(없애다, 일으키다). -업-, -읍-, -브-가 붙은 말은 소리대로(미덥다, 우습다, 미쁘다).'],
 [23,4,'-하다·-거리다 어근 + -이','-하다나 -거리다가 붙는 어근에 -이가 붙어 명사가 된 것은 원형을 밝힌다(오뚝이, 꿀꿀이). 붙지 않는 어근이면 밝히지 않는다(개구리, 귀뚜라미).'],
 [24,4,'-거리다 어근 + -이다','-거리다가 붙는 어근에 -이다가 붙어서 된 용언은 원형을 밝힌다(망설이다, 속삭이다).'],
 [25,4,'-하다 어근·부사 + -히/-이','-하다가 붙는 어근에 -히나 -이가 붙어 부사가 되면 원형을 밝힌다(꾸준히, 어렴풋이). 부사에 -이가 붙어도 원형을 밝힌다(곰곰이, 일찍이). -하다가 붙지 않으면 소리대로(갑자기, 슬며시).'],
 [26,4,'-하다·-없다','-하다나 -없다가 붙어서 된 용언은 -하다, -없다를 밝혀 적는다(숱하다, 부질없다).'],
 [27,4,'합성어·접두사','둘 이상의 단어가 어울리거나 접두사가 붙은 말은 원형을 밝힌다(꺾꽂이, 싫증). 어원이 분명하지 않으면 밝히지 않는다(며칠, 부리나케). 이[齒]가 합성어에서 [니]로 나면 니로 적는다(덧니).'],
 [28,4,'ㄹ이 소리 나지 않는 것','끝소리가 ㄹ인 말과 딴 말이 어울릴 적에 ㄹ 소리가 나지 아니하는 것은 아니 나는 대로 적는다(따님, 소나무, 바느질).'],
 [29,4,'ㄹ이 ㄷ으로 나는 것','끝소리가 ㄹ인 말과 딴 말이 어울릴 적에 ㄹ 소리가 ㄷ으로 소리 나는 것은 ㄷ으로 적는다(숟가락, 이튿날, 반짇고리).'],
 [30,4,'사이시옷','합성어에서 뒷말 첫소리가 된소리로 나거나 ㄴ, ㄴㄴ 소리가 덧나면 사이시옷을 받치어 적는다. 두 음절 한자어는 곳간, 셋방, 숫자, 찻간, 툇간, 횟수만 적는다.'],
 [31,4,'ㅂ·ㅎ이 덧나는 것','두 말이 어울릴 적에 ㅂ 소리나 ㅎ 소리가 덧나는 것은 소리대로 적는다(햅쌀, 볍씨, 살코기, 안팎).'],
 [32,4,'준말: 끝모음이 준 것','단어의 끝모음이 줄어지고 자음만 남은 것은 앞 음절의 받침으로 적는다(엊저녁, 기럭아).'],
 [33,4,'준말: 체언 + 조사','체언과 조사가 어울려 줄어지는 경우에는 준 대로 적는다(그건, 그게, 뭘).'],
 [34,4,'준말: ㅏ, ㅓ 어간','모음 ㅏ, ㅓ로 끝난 어간에 -아/-어, -았-/-었-이 어울릴 적에는 준 대로 적는다(가, 갔다, 했다).'],
 [35,4,'준말: ㅗ, ㅜ, ㅚ 어간','ㅗ, ㅜ로 끝난 어간에 -아/-어가 어울려 ㅘ, ㅝ가 되면 준 대로(봐, 줘). ㅚ 뒤에 -어, -었-이 어울려 ㅙ, ㅙㅆ이 되면 준 대로(돼, 됐다, 봬).'],
 [36,4,'준말: ㅣ + -어','ㅣ 뒤에 -어가 와서 ㅕ로 줄 적에는 준 대로 적는다(가져, 견뎌, 다녀).'],
 [37,4,'준말: + -이-','ㅏ, ㅕ, ㅗ, ㅜ, ㅡ로 끝난 어간에 -이-가 와서 각각 ㅐ, ㅖ, ㅚ, ㅟ, ㅢ로 줄 적에는 준 대로 적는다(보이다→뵈다, 뜨이다→띄다).'],
 [38,4,'준말: + -이어','ㅏ, ㅗ, ㅜ, ㅡ 뒤에 -이어가 어울려 줄어질 적에는 준 대로 적는다(쓰이어→씌어/쓰여, 트이어→틔어/트여).'],
 [39,4,'준말: -잖-, -찮-','-지 뒤에 않-이 어울려 -잖-이 될 적과 -하지 뒤에 않-이 어울려 -찮-이 될 적에는 준 대로 적는다(그렇잖은, 만만찮다).'],
 [40,4,'준말: 하의 줄어듦','어간 끝음절 하의 ㅏ가 줄고 ㅎ이 다음 음절 첫소리와 어울려 거센소리가 되면 거센소리로 적는다(간편케, 흔타). 하가 아주 줄 적에는 준 대로 적는다(생각건대, 넉넉지, 익숙지). 부사로 굳은 말(아무튼, 하마터면, 요컨대).'],
 [41,5,'조사','조사는 그 앞말에 붙여 쓴다.'],
 [42,5,'의존 명사','의존 명사는 띄어 쓴다.'],
 [43,5,'단위 명사','단위를 나타내는 명사는 띄어 쓴다. 순서를 나타내거나 숫자와 어울려 쓰이면 붙여 쓸 수 있다(두시 삼십분, 10개).'],
 [44,5,'수','수를 적을 적에는 만 단위로 띄어 쓴다.'],
 [45,5,'이어 주는 말','두 말을 이어 주거나 열거할 적에 쓰이는 겸, 내지, 대, 및, 등은 띄어 쓴다.'],
 [46,5,'단음절 연속','단음절로 된 단어가 연이어 나타날 적에는 붙여 쓸 수 있다(좀더 큰것).'],
 [47,5,'보조 용언','보조 용언은 띄어 씀을 원칙으로 하되, 붙여 씀도 허용한다. 다만 앞말에 조사가 붙거나, 앞말이 합성 용언이거나, 중간에 조사가 들어가면 띄어 쓴다.'],
 [48,5,'성명','성과 이름, 성과 호는 붙여 쓰고, 덧붙는 호칭어, 관직명은 띄어 쓴다. 성과 이름을 분명히 구분할 필요가 있으면 띄어 쓸 수 있다(남궁 억).'],
 [49,5,'고유 명사','성명 이외의 고유 명사는 단어별로 띄어 씀을 원칙으로 하되, 단위별로 띄어 쓸 수 있다(대한 중학교/대한중학교).'],
 [50,5,'전문 용어','전문 용어는 단어별로 띄어 씀을 원칙으로 하되, 붙여 쓸 수 있다(만성 골수성 백혈병/만성골수성백혈병).'],
 [51,6,'-이/-히','부사의 끝음절이 분명히 이로만 나는 것은 -이로 적고, 히로만 나거나 이나 히로 나는 것은 -히로 적는다.'],
 [52,6,'한자어 본음·속음','한자어에서 본음으로도 나고 속음으로도 나는 것은 각각 그 소리에 따라 적는다(승낙/수락, 분노/희로애락, 오뉴월, 시월).'],
 [53,6,'어미의 예사소리','-(으)ㄹ게, -(으)ㄹ걸, -(으)ㄹ수록, -(으)ㄹ지라도 같은 어미는 예사소리로 적는다. 다만 의문을 나타내는 -(으)ㄹ까, -(으)ㄹ꼬, -(스)ㅂ니까는 된소리로 적는다.'],
 [54,6,'접미사의 된소리','-꾼, -깔, -때기, -꿈치, -빼기, -쩍다 같은 접미사는 된소리로 적는다(일꾼, 빛깔, 곱빼기, 겸연쩍다).'],
 [55,6,'한 가지로 적는 말','두 가지로 구분하여 적던 것을 한 가지로 적는다(맞추다, 뻗치다).'],
 [56,6,'-더라/-던, -든지','지난 일을 나타내는 어미는 -더라, -던으로 적고, 물건이나 일의 내용을 가리지 않는 뜻을 나타내는 조사와 어미는 -든지로 적는다.'],

      if(k==='pair')return{key:'p'+P.c,n:P.n,tag:`바른 표기 · ${L(P.n)} ${ART[P.n].t}`,html:'둘 중 바른 표기는?',opts:shuffle([P.c,P.w]),c:P.c,q:`${P.c} / ${P.w}`,exp:P.e};

}

  $('meLab').innerHTML=`<img src="${AVA[ME]}" style="height:20px;vertical-align:middle"> ${ME}`;
  $('rdLab').textContent=R.practice?'연습':`${R.idx+1}/${R.list.length}`;$('gName').textContent=g.name;$('area').innerHTML='';$('rule').textContent='';$('tBar').style.width='100%';
  let n=3;overlay(`<h2>${g.name}</h2><div class="host"><img src="${AVA[ME]}" alt=""><div class="say">${g.desc}<br><span style="font-size:13px;opacity:.75">${g.line}</span></div></div><p style="font-size:14px">범위: ${RANGES.find(r=>r[0]===RANGE)[1]}</p><div class="cnt" id="cnt">3</div>`);
  SFX.beep();const ci=setInterval(()=>{n--;if(n>0){$('cnt').textContent=n;SFX.beep()}else{clearInterval(ci);hideOv();SFX.go();go()}},900);timers.push(ci);
  function go(){
    const t0=performance.now();let last=t0;const frames=[];
    const ctx={t:()=>(performance.now()-t0)/1000,frame:f=>frames.push(f),rule:h=>{$('rule').innerHTML=h}};
    g.start($('area'),ctx);
    const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;frames.forEach(f=>f(dt));
      const left=g.dur-(now-t0)/1000,r=Math.max(0,left/g.dur),b=$('tBar');b.style.width=r*100+'%';b.style.background=r<.25?'#D9443A':r<.5?'#E9A23B':'#2E9B5F';
      if(left<=0||R.endNow){endGame(R.endNow);return}loopId=requestAnimationFrame(loop)};
    loopId=requestAnimationFrame(loop);
  }
}
function endGame(out){
  clearAll();const name=GAMES[R.list[R.idx]].name;R.per.push([name,R.gScore]);saveRec(R.list[R.idx],Math.max(0,R.gScore));R.idx++;
  if(R.idx<R.list.length){overlay(`<h2>${out?'하트 다 씀':name+' 끝'}</h2><p style="font-size:30px;color:#D9A520;margin:4px 0">+${Math.max(0,R.gScore)}</p><p>다음 게임 준비</p>`);timers.push(setTimeout(runGame,1500))}
  else finish();
}
function grade(s){return s>=14000?['S','규정까지 꿰뚫음']:s>=10000?['A','거의 다 왔어요']:s>=6000?['B','기본은 잡혔어요']:s>=3000?['C','도감에서 조항 다시 보기']:['D','틀린 것 다시 보기부터']}
function finish(){
  hideOv();show('result');const [g,cm]=grade(R.score);$('rsAva').src=AVA[ME];
  $('rsTitle').textContent=R.practice?`${ME} 연습 끝`:`${ME} 대작전 끝`;$('rsScore').textContent=R.score.toLocaleString()+'점';
  $('rsGrade').textContent=R.practice?`정답 ${R.right}개 · 오답 ${R.wrongN}개`:`${g}등급 · ${cm}`;
  $('rsGames').innerHTML=R.per.map(p=>`<span>${p[0]}</span><b>${Math.max(0,p[1]).toLocaleString()}</b>`).join('')+`<span>정답 / 오답</span><b>${R.right} / ${R.wrongN}</b>`+`<span>이번에 별 받은 조항</span><b>${R.arts.size}개</b>`+(R.missed.length?`<span>놓친 오타</span><b>${R.missed.length}</b>`:'');
  const miss=[...new Map(R.missed.map(m=>[m.w,m])).values()].slice(0,6);
  const rows=R.wrong.slice(-14).map(w=>`<div class="it">${w.q} → <span class="a">${w.a}</span><br><span class="law">${L(w.n)} ${ART[w.n].t}</span>${w.exp}</div>`)
    .concat(miss.map(m=>`<div class="it">놓친 오타 ${m.w} → <span class="a">${m.c}</span><br><span class="law">${L(m.n)} ${ART[m.n].t}</span>${m.e}</div>`));
  $('rev').innerHTML=rows.length?rows.join(''):'<div class="it">틀린 것 없음</div>';
  if(!R.practice)saveRec('total',R.score);SFX.fan();if(R.practice||R.score>=6000)setTimeout(confetti,300);
}
function confetti(){const cols=['#F4C95D','#F7B6C8','#2E9B5F','#D9443A','#7FB3E8'];for(let i=0;i<60;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'%';d.style.background=pick(cols);
  $('result').appendChild(d);d.animate([{transform:'translateY(0) rotate(0)'},{transform:`translateY(${innerHeight+40}px) rotate(${Math.random()*900}deg) translateX(${(Math.random()-.5)*120}px)`}],{duration:1600+Math.random()*1600,delay:Math.random()*500,easing:'ease-in'}).onfinish=()=>d.remove()}}

/* ================= 도감 ================= */
function examples(n){const ex=[...PAIRS.filter(p=>p.n===n).map(p=>p.c),...SENT.filter(p=>p.n===n).map(p=>p.c),...SPACE.filter(p=>p.n===n).map(p=>p.c),...ALLOW.filter(p=>p.n===n).map(p=>p.b)];return[...new Set(ex)].slice(0,8)}
function renderDex(){
  const m=ME?getM(ME):{};let full=0;let h='',ch=0;
  for(const a of ARTS){const [n,c,t,k]=a;if(c!==ch){ch=c;h+=`<div class="chap">${CHAP[c]}</div>`}
    const s=stars(m[n]||0);if(s===3)full++;const ex=examples(n);
    h+=`<div class="art ${s===3?'m3':''}"><div class="h"><span><b>제${n}항</b>${t}</span><span class="stars">${'★'.repeat(s)}<i>${'★'.repeat(3-s)}</i></span></div><div class="k">${k}</div>${ex.length?`<div class="ex">예) ${ex.join(', ')}</div>`:''}</div>`}
  $('dexList').innerHTML=h;$('dexWho').innerHTML=ME?`<img src="${AVA[ME]}" style="height:22px;vertical-align:middle"> ${ME}의 도감`:'학생을 고르면 별이 보여요';$('dexCount').textContent=`별 3개 조항 ${full} / ${ARTS.length}`;
}

/* ================= 순위표 ================= */
const LS='md-spell-board2';
const getB=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(_){return[]}};
const putB=a=>{try{localStorage.setItem(LS,JSON.stringify(a))}catch(_){}};
function saveRec(g,score){const a=getB();let r=a.find(x=>x.name===ME);if(!r){r={name:ME,best:{},n:{}};a.push(r)}r.n[g]=(r.n[g]||0)+1;if(!(g in r.best)||score>r.best[g])r.best[g]=score;putB(a);CLOUD.save('spelling_'+g,ME,score)}
let tab='total';const BTABS=[['total','종합'],['slice','오타 베기'],['tug','규정 줄다리기'],['dex','도감 별']];
$('btabs').innerHTML=BTABS.map(([k,n])=>`<button data-t="${k}" class="${k==='total'?'on':''}">${n}</button>`).join('');
$('btabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;[...$('btabs').children].forEach(x=>x.classList.toggle('on',x===b));renderBoard()};
let boardSeq=0;
async function renderBoard(){
  const my=++boardSeq;let cloud=null;
  if(tab!=='dex'){$('tbl').innerHTML='<tr><td style="text-align:center;padding:18px">순위표 불러오는 중</td></tr>';$('podium').innerHTML='';cloud=await CLOUD.top('spelling_'+tab);if(my!==boardSeq)return}
  $('boardNote').textContent=tab==='dex'?'도감 별은 각자 게임한 기기에 저장돼요.':cloud?'모두의 기록이 모여요. 사람마다 최고 점수로 순위를 매겨요.':'인터넷 연결이 안 돼서 이 기기 기록만 보여요.';
  const a=getB();const rows=KIDS.map(([n])=>{if(tab==='dex'){const m=getM(n);const s=ARTS.reduce((t,x)=>t+stars(m[x[0]]||0),0);return{name:n,s:s||null,n:0,unit:'개'}}
    if(cloud){const c=cloud.find(x=>x.name===n);return{name:n,s:c?c.best:null,n:c?c.n:0}}
    const r=a.find(x=>x.name===n);return{name:n,s:r&&tab in r.best?r.best[tab]:null,n:r?.n?.[tab]||0}});
  rows.sort((x,y)=>(y.s??-1)-(x.s??-1));
  const top=rows.filter(r=>r.s!=null).slice(0,3),order=[1,0,2],hgt=[64,90,50];
  const fmt=r=>tab==='dex'?`별 ${r.s}개`:r.s.toLocaleString();
  $('podium').innerHTML=order.filter(i=>top[i]).map(i=>`<div class="p"><img src="${AVA[top[i].name]}" alt=""><div class="nm">${top[i].name}</div><div class="sc">${fmt(top[i])}</div><div class="blk" style="height:${hgt[i]}px">${i+1}</div></div>`).join('');
  $('tbl').innerHTML=rows.map((r,i)=>`<tr class="${r.name===ME?'me':''}"><td class="r">${r.s!=null?i+1:'-'}</td><td><img src="${AVA[r.name]}" alt="">${r.name} <small>${tab==='dex'?`최대 ${ARTS.length*3}개`:r.n?r.n+'번 도전':'아직 안 함'}</small></td><td class="s">${r.s!=null?fmt(r):''}</td></tr>`).join('');
}
let clrArm=false;
$('clrBtn').onclick=()=>{if(!clrArm){clrArm=true;$('clrBtn').textContent='한 번 더 누르면 삭제';setTimeout(()=>{clrArm=false;$('clrBtn').textContent='기록 전부 지우기'},2500);return}
  putB([]);KIDS.forEach(([n])=>{try{localStorage.removeItem(MK(n))}catch(_){}});clrArm=false;$('clrBtn').textContent='기록 전부 지우기';renderBoard()};

/* ================= 화면 ================= */
const show=id=>['home','play','result','board','dex'].forEach(s=>$(s).hidden=s!==id);
function overlay(h){$('ovCard').innerHTML=h;$('ov').hidden=false}
function hideOv(){$('ov').hidden=true}
$('who').innerHTML=KIDS.map(([n])=>`<button data-n="${n}"><img src="${AVA[n]}" alt="">${n}</button>`).join('');
$('who').onclick=e=>{const b=e.target.closest('button');if(!b)return;ME=b.dataset.n;[...$('who').children].forEach(x=>x.classList.toggle('on',x===b));try{localStorage.setItem('md-me',ME)}catch(_){}};
try{const m=localStorage.getItem('md-me');if(m&&AVA[m]){ME=m;$('who').querySelector(`[data-n="${m}"]`).classList.add('on')}}catch(_){}
$('range').innerHTML=RANGES.map(([k,n])=>`<button data-r="${k}" class="${k==='all'?'on':''}">${n}</button>`).join('');
$('range').onclick=e=>{const b=e.target.closest('button');if(!b)return;RANGE=b.dataset.r;[...$('range').children].forEach(x=>x.classList.toggle('on',x===b))};
$('glist').innerHTML=Object.entries(GAMES).map(([k,g])=>`<button data-k="${k}">${g.name} 연습<small>${g.dur}초</small></button>`).join('');
function need(){if(!ME){shake($('who'));return true}return false}
$('goBtn').onclick=()=>{if(need())return;startRun(['slice','tug'])};
$('glist').onclick=e=>{const b=e.target.closest('button');if(!b||need())return;startRun([b.dataset.k])};
$('againBtn').onclick=()=>startRun(R.list);
async function showPlays(){const n=await CLOUD.plays('spelling');if(n!=null)$('playCount').textContent=`지금까지 ${n.toLocaleString()}번 플레이`}
showPlays();
const toBoard=()=>{show('board');renderBoard()};$('rankBtn').onclick=toBoard;$('rank2Btn').onclick=toBoard;
const toDex=()=>{show('dex');renderDex();$('dex').scrollTop=0};$('dexBtn').onclick=toDex;$('dex2Btn').onclick=toDex;
$('homeBtn').onclick=()=>show('home');$('home2Btn').onclick=()=>show('home');$('dexHome').onclick=()=>show('home');
</script>
</body>
